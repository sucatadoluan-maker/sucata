<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucata do Luan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- WHATSAPP FIXO -->
<a href="https://wa.me/558386211692" class="whatsapp-fixo" target="_blank">
    <img src="imagens/whatsapp-logo-icon-isolated-on-transparent-background-free-png.png">
</a>

<header class="logo">

    <img src="imagens/WhatsApp_Image_2026-03-12_at_10.12.31-removebg-preview.png" class="sct">

    <input type="text" id="busca" placeholder="Buscar produto..." onkeyup="filtrarProdutos()">

    <p class="frase">
        ✔ Qualidade garantida | 🚚 Envio rápido | 💬 Atendimento imediato
    </p>

    <div class="redes">

    <a href="https://wa.me/558386211692" target="_blank" class="social whatsapp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <a href="https://www.instagram.com/sucata_do_luan/" target="_blank" class="social instagram">
        <i class="fab fa-instagram"></i>
    </a>

    <a href="#" target="_blank" class="social facebook">
        <i class="fab fa-facebook-f"></i>
    </a>

</div>

</header>

<!-- PRODUTOS -->
<div class="grid" id="lista-produtos">
</div>

<p id="nenhum-produto" class="nenhum-produto">
    ❌ Nenhum produto encontrado <br>
    💬 Fale conosco no WhatsApp para consultar
</p>

<!-- MODAL (ZOOM) -->
<div id="modal" class="modal" onclick="fecharModal()">
    <img id="img-modal" onclick="event.stopPropagation()">
</div>

<footer class="rodape">
    <p>🚗 Peças usadas com qualidade | 📦 Enviamos para todo Brasil</p>
</footer>

<script>
const produtos = [
  {
    nome: "Lanterna Traseira Ford Ka Original Esquerda 2015 a 2018",
    preco: "R$ 299,99",
    precoAntigo: "R$ 399,99",
    imagem: "imagens/WhatsApp Image 2024-09-30 at 10-33-20 (2).jpeg"
  },
  {
    nome: "Volante Direção Vw Gol Saveiro Voyage G5 G6 Fox 1º Geração Preto",
    preco: "R$ 289,99",
    precoAntigo: "R$ 399,99",
    imagem: "imagens/WhatsApp Image 2025-11-19 at 16-16-04 (2).jpeg"
  },
  {
    nome: "Comando Ar Condicionado Gm S10 Trailblazer 2012 A 2017",
    preco: "R$ 399,99",
    precoAntigo: "R$ 450,00",
    imagem: "imagens/WhatsApp Image 2026-03-17 at 09.00.45 (3).jpeg"
  },
  {
    nome: "Forro Porta Dianteira Fox 2 Portas 2004 A 2014 Lado Esquerdo",
    preco: "R$ 599,99",
    precoAntigo: "R$ 699,99",
    imagem: "imagens/forro.jpeg"
  },
  {
    nome: "Polia Dentada Virabrequim Vw Gol Fox 1994 A 2006",
    preco: "R$ 69,99",
    precoAntigo: "R$ 99,99",
    imagem: "imagens/polia.jpeg"
  },
  {
    nome: "Fechadura Inferior Capo Vw Gol Voyage Fox 2009 A 2024",
    preco: "R$ 159,99",
    precoAntigo: "R$ 199,99",
    imagem: "imagens/fechadura.jpeg"
  },
  {
    nome: "Motor Tiida Livina 1.8 16v Flex 2009 a 2014",
    preco: "R$ 11.899,99",
    precoAntigo: "R$ 12.499,99",
    imagem: "imagens/motor.jpeg"
  },
  {
    nome: "Fechadura Inferior Capo Vw Gol Voyage Fox 2009 A 2024",
    preco: "R$ 159,99",
    precoAntigo: "R$ 199,99",
    imagem: "imagens/parachoque.jpeg"
  }
  
];

function carregarProdutos() {
  const lista = document.getElementById("lista-produtos");

  produtos.forEach(p => {
    lista.innerHTML += `
      <div class="produto">

        <span class="badge">OFERTA</span>

        <img src="${p.imagem}" onclick="abrirModal('${p.imagem}')">

        <h2>${p.nome}</h2>

        <p class="avaliacao">⭐⭐⭐⭐⭐ (4.9)</p>

        <p class="preco-antigo">${p.precoAntigo}</p>
        <p class="preco">${p.preco}</p>

        <p class="estoque">✔ Em estoque</p>

        <button>
          <a href="https://wa.me/558386211692?text=Olá tenho interesse no ${p.nome}" target="_blank">
            Comprar
          </a>
        </button>

      </div>
    `;
  });
}

function abrirModal(src) {
    document.getElementById("modal").style.display = "flex";
    document.getElementById("img-modal").src = src;
}

function fecharModal() {
    document.getElementById("modal").style.display = "none";
}

function filtrarProdutos() {
  let input = document.getElementById("busca").value.toLowerCase();
  let itens = document.getElementsByClassName("produto");
  let mensagem = document.getElementById("nenhum-produto");

  let encontrou = false;

  // 👉 FECHA O MODAL AUTOMATICAMENTE
  fecharModal();

  for (let i = 0; i < itens.length; i++) {
    let nome = itens[i].getElementsByTagName("h2")[0].innerText.toLowerCase();

    if (nome.includes(input)) {
      itens[i].style.display = "block";
      encontrou = true;
    } else {
      itens[i].style.display = "none";
    }
  }

  // 👉 MOSTRA OU ESCONDE MENSAGEM
  if (!encontrou) {
    mensagem.style.display = "block";
  } else {
    mensagem.style.display = "none";
  }
}

carregarProdutos();

window.addEventListener("scroll", function () {
  let rodape = document.querySelector(".rodape");

  if (window.scrollY > 150) {
    rodape.classList.add("ativo");
  } else {
    rodape.classList.remove("ativo");
  }
});

</script>

</body>
</html>
